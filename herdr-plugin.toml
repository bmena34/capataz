# capataz-herdr — herdr plugin
#
# Brings capataz's workflow layer (.scratch issue backlog, capataz issue CLI,
# ParallelSafe dispatch waves, drain orchestrator, skills) into herdr as a
# first-class plugin.
#
# Local dev:
#   herdr plugin link /Users/brandon/code/capataz-herdr
#   herdr server reload-config   (or restart herdr)
#
# CAPATAZ_BIN — override the capataz binary path before `make install`:
#   export CAPATAZ_BIN=/Users/brandon/code/capataz/capataz
#
# Two proven gotchas from the 0.8.0 spike (see experiments/herdr-plugin/README.md):
#   1. Pane entrypoint paths resolve vs the pane --cwd, NOT the plugin root.
#      Fix: command = ["sh","-c","exec \"$HERDR_PLUGIN_ROOT/bin/<script>.sh\""]
#   2. Actions receive focused-pane cwd via HERDR_PLUGIN_CONTEXT_JSON (JSON blob)
#      not a plain env var; open-issues.sh parses focused_pane_cwd from it.

id = "bmena34.capataz-herdr"
name = "Capataz"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "capataz's .scratch issue backlog, parallel-safe dispatch waves, and drain orchestrator as a herdr plugin. Popup issue view, hands-off drain action, worktree-event hook."
platforms = ["macos", "linux"]

# ---------------------------------------------------------------------------
# Build step — compiles the drain orchestrator binary.
#
# herdr runs this once after `herdr plugin install` (or `herdr plugin link .`
# when you explicitly trigger a build). The result is ./bin/drain, which the
# `drain` action below invokes. bin/drain is gitignored (build artifact).
#
# This repo requires Go — there is no prebuilt-release fallback.
[[build]]
platforms = ["macos", "linux"]
command = ["sh", "scripts/build.sh"]

# ---------------------------------------------------------------------------
# issues — the backlog popup pane.
#
# Opens capataz's daemon-free full-screen issue viewer (`capataz issues`) in a
# centered popup hosted by herdr, sized to ~70% of the terminal (width/height
# are only honored when placement = "popup"; an "overlay" always fills the
# screen). herdr restores focus when it exits. CAPATAZ_BIN lets a locally-built
# binary be used before `make install`.
#
# open-issues.sh omits --placement/--width/--height so this declaration is the
# single source of truth for the pane's size.
#
# Opened via:
#   herdr plugin pane open --plugin bmena34.capataz-herdr --entrypoint issues --cwd <repo>
# or via the `issues` action below.
[[panes]]
id = "issues"
title = "Capataz: Backlog"
placement = "popup"
# ~70% of the terminal area. PopupSize accepts a percentage ("^(100|[1-9][0-9]?)%$")
# or an integer cell count (border included).
width = "70%"
height = "70%"
platforms = ["macos", "linux"]
# Resolve via $HERDR_PLUGIN_ROOT — herdr evaluates a pane's command relative
# to the pane's --cwd, which is the focused repo dir (not the plugin root).
# A bare "./bin/issues-ui.sh" would look in the repo and fail.
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/issues-ui.sh\""]

# ---------------------------------------------------------------------------
# issues action — open the backlog overlay in the focused pane's repo.
#
# Bind in herdr's config.toml with type = "plugin_action"; action id is the
# positional arg (--plugin is optional trailing flag):
#   herdr plugin action invoke issues
[[actions]]
id = "issues"
title = "Capataz: Open Backlog"
platforms = ["macos", "linux"]
command = ["./bin/open-issues.sh"]

# ---------------------------------------------------------------------------
# drain action — invoke the dispatch orchestrator.
#
# The orchestrator binary (cmd/drain) is implemented in issue 03. This entry
# declares the full action surface so later slices don't need to touch this
# file. The binary at ./bin/drain is the built output of cmd/drain.
#
# Usage:
#   herdr plugin action invoke drain
[[actions]]
id = "drain"
title = "Capataz: Drain Backlog"
platforms = ["macos", "linux"]
# issue 03 implements the orchestrator binary at ./bin/drain.
command = ["./bin/drain"]

# ---------------------------------------------------------------------------
# usage — plan-usage gauge popup pane.
#
# Opens a short-lived popup that runs `capataz usage`: reads the Claude
# Code OAuth token from the macOS Keychain and prints the live plan-usage
# gauge (session % + bar + reset time; weekly % + bar + reset time).
# The gauge is only 4 lines (widest ~55 cols) plus the "press any key" prompt,
# so the popup is sized in fixed cells to be as small as the content allows
# rather than filling the screen (width/height are only honored for popups).
# NOTE: capataz usage calls an UNOFFICIAL Anthropic endpoint — the same one
# `claude`'s /usage shows. It is not documented and can change; the URL and
# keychain_service are configurable in ~/.config/capataz/config.json, and
# usage.enabled=false disables it entirely.
#
# open-usage.sh omits --placement/--width/--height so this declaration is the
# single source of truth for the pane's size.
#
# Opened via:
#   herdr plugin pane open --plugin bmena34.capataz-herdr --entrypoint usage
# or via the `usage` action below.
[[panes]]
id = "usage"
title = "Capataz: Plan Usage"
placement = "popup"
# Fixed cell size (border included): just big enough for the gauge + prompt.
width = 60
height = 9
platforms = ["macos", "linux"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/usage-ui.sh\""]

# ---------------------------------------------------------------------------
# usage action — open the plan-usage overlay.
#
# Bind in herdr's config.toml with type = "plugin_action"; action id is the
# positional arg:
#   herdr plugin action invoke usage
[[actions]]
id = "usage"
title = "Capataz: Plan Usage"
platforms = ["macos", "linux"]
command = ["./bin/open-usage.sh"]

# ---------------------------------------------------------------------------
# worktree.created event hook.
#
# herdr fires this when it creates a git worktree. In the drain loop capataz
# uses this to detect the new worktree and dispatch a capataz-work subagent
# into it. The current handler (on-worktree.sh) logs the event JSON — the
# full dispatch logic lands with the orchestrator in issue 03.
[[events]]
on = "worktree.created"
platforms = ["macos", "linux"]
command = ["./bin/on-worktree.sh"]
